<div class="devui-content-nav">
  <d-sticky [container]="demoDocViewerMain">
    <div>
      <!-- <div class="devui-fast-forward">{{ goToText }}</div> -->
      <ul class="devui-step-nav">
        @for (navitem of navItems; track navitem) {
          <li dAnchorLink="{{ navitem.anchor }}" anchorActive="active">
            @if (categoryName) {
              {{ 'components.' + categoryName + '.' + navitem.name + '.title' | translate }}
            } @else {
              {{ navitem.value | translate}}
            }
          </li>
        }
      </ul>
    </div>
  </d-sticky>
</div>
