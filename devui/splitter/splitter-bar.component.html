@if (showCollapseButton) {
  <div
    class="prev"
    dPopover
    [style.left]="collapsePosLeft"
    [style.top]="collapsePosTop"
    [trigger]="'hover'"
    [controlled]="true"
    [ngClass]="prevClass"
    [content]="preTip"
    [showAnimation]="false"
    [mouseEnterDelay]="100"
    [mouseLeaveDelay]="0"
    (click)="collapsePrePane()"
    (touchstart)="collapsePrePane()"
  ></div>
}
<div class="devui-resize-handle"></div>
@if (showCollapseButton) {
  <div
    class="next"
    dPopover
    [trigger]="'hover'"
    [controlled]="true"
    [ngClass]="nextClass"
    [content]="nextTip"
    (click)="collapseNextPane()"
    (touchstart)="collapseNextPane()"
  ></div>
}
