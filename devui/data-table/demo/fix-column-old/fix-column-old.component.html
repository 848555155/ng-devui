<d-data-table #datatable [dataSource]="basicDataSource" [tableOverflowType]="'overlay'" [scrollable]="true" [checkable]="true">
  @for (colOption of dataTableOptions.columns; track colOption) {
    <d-column
      [field]="colOption.field"
      [header]="colOption.header"
      [fieldType]="colOption.fieldType"
      [width]="'150px'"
      [fixedLeft]="colOption?.fixedLeft || null"
      [fixedRight]="colOption?.fixedRight || null"
      >
    </d-column>
  }
</d-data-table>
