<d-data-table
  [dataSource]="dataSource"
  tableHeight="360px"
  [scrollable]="true"
  [virtualScroll]="true"
  [virtualItemSize]="40"
  [virtualMinBufferPx]="80"
  [virtualMaxBufferPx]="200"
  [tableOverflowType]="'overlay'"
  >
  <thead dTableHead>
    <tr dTableRow>
      @for (colOption of dataTableOptions.columns; track colOption) {
        <th dHeadCell>{{ colOption.header }}</th>
      }
    </tr>
  </thead>
  <tbody dTableBody>
    <ng-template let-rowItem="rowItem" let-rowIndex="rowIndex">
      <tr dTableRow>
        @for (colOption of dataTableOptions.columns; track colOption) {
          <td dTableCell>
            {{ colOption.fieldType === 'date' ? (rowItem[colOption.field] | i18nDate: 'short':false) : rowItem[colOption.field] }}
          </td>
        }
      </tr>
    </ng-template>
  </tbody>
</d-data-table>
