<section>
  <d-button bsStyle="primary" (click)="fetchTableData()">click me!</d-button>
  <table dLoading [view]="view" [loading]="loading()" [backdrop]="true" [loadingStyle]="'infinity'" class="table table-hover">
    <thead>
      <tr>
        <th>FirstName</th>
        <th>LastName</th>
        <th>UserName</th>
      </tr>
    </thead>
    <tbody>
      @for (names of tableNames();track names) {
      <tr>
        @for (name of names;track name) {
        <td>{{ name }}</td>
        }
      </tr>
      }
    </tbody>
  </table>
</section>
