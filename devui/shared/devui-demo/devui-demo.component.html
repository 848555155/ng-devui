<div class="devui-demo-container" dAnchorBox dAnchorHashSupport [view]="{ top: 180, bottom: 0 }">
  <d-demo-nav [navItems]="navItems()">></d-demo-nav>

  @for (demo of demos(); track demo.title) {
  <div class="devui-demo-example" [dAnchor]="demo.anchor">
    <div class="devui-demo-title">{{ demo.title | translate }}</div>
    @if (!demo.noDescription) {
    <div class="devui-demo-text">{{ demo.description | translate }}</div>
    }
    <d-codebox [sourceData]="demo.source">
      <ng-container *ngComponentOutlet="demo.component"></ng-container>
    </d-codebox>
  </div>
  }
</div>
