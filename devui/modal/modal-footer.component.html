@if (buttons?.length) {
  <div class="modal-footer">
    @for (button of buttons; track button) {
      <d-button
        [bsSize]="'md'"
        [attr.id]="button.id"
        (btnClick)="button.handler($event)"
        [bsStyle]="button.cssClass"
        circled="true"
        [width]="button.btnwidth"
        [autofocus]="button.autofocus"
        [disabled]="button.disabled"
        >{{ button.text }}
      </d-button>
    }
  </div>
}
