<section>
  <d-tabs [(activeTab)]="tabActiveId" [beforeChange]="beforeChange">
    @for (item of tabItems; track item) {
      <d-tab [id]="item.id">
        <ng-template dTabTitle>
          {{ item.title }}
        </ng-template>
        {{ item.content }}
      </d-tab>
    }
  </d-tabs>
</section>
