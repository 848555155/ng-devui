<section>
  <h3>Tabs</h3>
  <d-tabs
    type="tabs"
    [scrollMode]="'auto'"
    [addable]="true"
    [closeable]="true"
    [(activeTab)]="tabActiveId"
    (addOrDeleteTabChange)="handle($event, 'tab')"
    >
    @for (item of tabItems; track item) {
      <d-tab [id]="item.id" [title]="item.title"></d-tab>
    }
  </d-tabs>
  <br />
  <h3>Wrapped</h3>
  <d-tabs
    [type]="'wrapped'"
    [addable]="true"
    [scrollMode]="'auto'"
    [closeable]="true"
    [closeableIds]="['tab2', 'tab3']"
    [(activeTab)]="wrappedActiveId"
    (addOrDeleteTabChange)="handle($event, 'wrapped')"
    >
    @for (item of wrappedItems; track item) {
      <d-tab [id]="item.id" [title]="item.title"></d-tab>
    }
  </d-tabs>
</section>
