<d-button (click)="openToast()">click me show simplest toast!</d-button>
@if (!this.isShow) {
  <d-button (click)="openToast2()" bsStyle="common">click me show customer toast!</d-button>
}
@if (this.isShow) {
  <d-button (click)="closeToast2()">click me close customer toast!</d-button>
}
@if (this.isShow) {
  <d-button (click)="closeToast3()" bsStyle="common">only close first customer toast!</d-button>
}
