<div class="trigger" (click)="open.set(!open)">
  <span class="trigger-text">{{ open() ? 'click to hide menu' : 'click to show menu' }}</span>
</div>
@if (open()) {
<div class="menu" @collapseForDomDestroy>
  <div class="side-menu"></div>
  <div class="content-container">
    <d-skeleton></d-skeleton>
  </div>
</div>
}
