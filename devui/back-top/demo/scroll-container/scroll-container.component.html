<div class="devui-scroll-container">
  <ul #scrollContent class="devui-scroll-content devui-scrollbar">
    @for (item of list; track item;let index = $index) {
    <li class="item">
      {{ index + 1 + '. ' + item }}
    </li>
    }
  </ul>
  <d-back-top
    [draggable]="true"
    [scrollTarget]="scrollElement().nativeElement"
    [right]="'60px'"
    [bottom]="'30px'"
    (backTopEvent)="backTop($event)"
  ></d-back-top>
</div>
