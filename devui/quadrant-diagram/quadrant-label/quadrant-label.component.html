<ng-template
  [ngTemplateOutlet]="currentLabelTemplate ? currentLabelTemplate : defaultLabel"
  [ngTemplateOutletContext]="{
    $implicit: this,
    labelData: labelData
  }"
>
</ng-template>
<ng-template #defaultLabel let-labelData="labelData">
  @for (item of labelData; track item) {
  <div
    dDraggable
    [dragScope]="dropScope"
    [dragData]="{ item: item, parent: labelData }"
    (dragEndEvent)="handleDropOutRegion($event)"
    class="devui-list-style devui-{{ currentLabelSize }}-size"
    [style.position]="'absolute'"
    [style.top.px]="getLabelTopValue($safeNavigationMigration(item?.y), $safeNavigationMigration(currentCenterPoint?.y))"
    [style.left.px]="getLabelLeftValue($safeNavigationMigration(item?.x), $safeNavigationMigration(currentCenterPoint?.x))"
    dPopover
    [content]="$safeNavigationMigration(item?.content)"
    [position]="'bottom'"
    [controlled]="true"
    [trigger]="'hover'"
    (mouseover)="showAxisLine($safeNavigationMigration(item?.x), $safeNavigationMigration(item?.y))"
    (mouseout)="hideAxisLine()"
  >
    @if (currentLabelSize !== 'small') {
    <div class="devui-label-style">{{ item?.title }}</div>
    } @if (currentLabelSize === 'large') {
    <d-progress
      style="margin-top: -4px"
      [percentage]="$safeNavigationMigration(item?.progress)"
      [percentageText]="''"
      [strokeColor]="'#3ECCA6'"
      [height]="'4px'"
    >
    </d-progress>
    }
  </div>
  }
  <div
    class="devui-horizontal-line"
    [style.width.px]="view.width - axisConfigs.originPosition.left - axisConfigs.axisMargin"
    [style.left.px]="axisConfigs.originPosition.left"
    [style.display]="'none'"
  >
    <span class="devui-axis-value" id="devui-label-y-axis-value"></span>
  </div>
  <div
    class="devui-vertical-line"
    [style.height.px]="view.height - axisConfigs.originPosition.bottom - axisConfigs.axisMargin"
    [style.top.px]="axisConfigs.axisMargin"
    [style.display]="'none'"
  >
    <span class="devui-axis-value" id="devui-label-x-axis-value"></span>
  </div>
</ng-template>
